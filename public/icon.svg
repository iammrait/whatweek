<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      .bg-light { display: block; }
      .bg-dark  { display: none; }
      .fg { fill: #ffffff; }

      @media (prefers-color-scheme: dark) {
        .bg-light { display: none; }
        .bg-dark  { display: block; }
        .fg { fill: #fb7185; }
      }
    </style>
    <linearGradient id="grad-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <rect class="bg-light" width="512" height="512" rx="112" fill="url(#grad-light)"/>
  <rect class="bg-dark" width="512" height="512" rx="112" fill="#0b1220"/>

  <text x="50%" y="52%" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="260" font-weight="900" class="fg" letter-spacing="-10">W</text>
</svg>
